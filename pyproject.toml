[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandos"
version = "0.1.0"
description = "Retail demand intelligence and cost-aware inventory decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "pyarrow>=18,<24"]

[tool.setuptools.packages.find]
where = ["src"]
