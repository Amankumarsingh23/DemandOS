[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandos"
version = "0.1.0"
description = "Retail demand intelligence and cost-aware inventory decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "pyarrow>=18,<24"]

[project.optional-dependencies]
analytics = ["duckdb>=1.4,<2", "dbt-duckdb>=1.9,<2", "dbt-core>=1.10.5,<2"]
eda = ["duckdb>=1.4,<2", "matplotlib>=3.9,<4", "statsmodels>=0.14,<1"]
boosting = ["lightgbm>=4.7,<5", "xgboost>=3.1,<4", "catboost>=1.2.10,<2", "scikit-learn>=1.9,<2"]
neural = ["torch>=2.14.1,<2.15"]

[tool.setuptools.packages.find]
where = ["src"]
